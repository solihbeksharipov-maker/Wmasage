<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wmasage</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  // Mavzuni sahifa chizilishidan oldin o'rnatamiz (miltillashsiz)
  (function(){ var th; try{ th = localStorage.getItem('theme'); }catch(e){}
    if(!th) th = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    document.documentElement.dataset.theme = th; })();
</script>
<style>
  :root{
    --serif:'Cormorant Garamond','Times New Roman',serif;
    --sans:'Manrope',system-ui,sans-serif;
  }
  :root[data-theme="dark"]{
    --bg:#050505; --fg:#f5f5f2; --muted:rgba(245,245,242,.55);
    --panel:rgba(16,16,16,.72); --chat-bg:#080808;
    --glass-a:rgba(255,255,255,.16); --glass-b:rgba(255,255,255,.05);
    --edge:rgba(212,175,55,.24); --edge-hi:rgba(247,224,138,.55);
    --gold:#d4af37; --gold-a:#f7e08a; --gold-b:#b8860b; --gold-fg:#1a1200;
    --pri-a:#f7e08a; --pri-b:#b8860b; --pri-fg:#1a1200;
    --mine-a:#f3d676; --mine-b:#c29627; --mine-fg:#1a1200;
    --theirs:rgba(255,255,255,.09);
    --shadow:0 24px 70px rgba(0,0,0,.65);
    --lights:radial-gradient(900px 600px at 10% -10%,rgba(212,175,55,.24),transparent 60%),radial-gradient(800px 600px at 100% 110%,rgba(212,175,55,.13),transparent 60%);
    --wall-glow:radial-gradient(70% 45% at 85% 0%,rgba(247,224,138,.16),transparent 70%),radial-gradient(60% 40% at 0% 100%,rgba(212,175,55,.10),transparent 70%);
    --sheen:rgba(255,255,255,.055);
    --veins:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='900'><filter id='f' x='0' y='0' width='100%25' height='100%25' color-interpolation-filters='sRGB'><feTurbulence type='turbulence' baseFrequency='0.0045 0.0075' numOctaves='5' seed='11' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .87 0 0 0 0 .70 0 0 0 0 .25 -7 0 0 0 1.25'/></filter><rect width='100%25' height='100%25' filter='url(%23f)' opacity='.38'/></svg>");
  }
  :root[data-theme="light"]{
    --bg:#ecece9; --fg:#0a0a0a; --muted:rgba(10,10,10,.55);
    --panel:rgba(255,255,255,.62); --chat-bg:#efefec;
    --glass-a:rgba(255,255,255,.85); --glass-b:rgba(255,255,255,.35);
    --edge:rgba(160,120,20,.22); --edge-hi:rgba(255,248,220,1);
    --gold:#b8860b; --gold-a:#f3d676; --gold-b:#b07d0a; --gold-fg:#1a1200;
    --pri-a:#f3d676; --pri-b:#b07d0a; --pri-fg:#1a1200;
    --mine-a:#f3d676; --mine-b:#b98a14; --mine-fg:#1a1200;
    --theirs:rgba(255,255,255,.78);
    --shadow:0 24px 60px rgba(0,0,0,.16);
    --lights:radial-gradient(900px 600px at 10% -10%,#ffffff,transparent 60%),radial-gradient(800px 600px at 100% 110%,rgba(212,175,55,.28),transparent 60%);
    --wall-glow:radial-gradient(70% 45% at 85% 0%,rgba(255,255,255,.95),transparent 70%),radial-gradient(60% 40% at 0% 100%,rgba(212,175,55,.18),transparent 70%);
    --sheen:rgba(255,255,255,.7);
    --veins:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='900'><filter id='f' x='0' y='0' width='100%25' height='100%25' color-interpolation-filters='sRGB'><feTurbulence type='turbulence' baseFrequency='0.0045 0.0075' numOctaves='5' seed='11' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .72 0 0 0 0 .53 0 0 0 0 .08 -7 0 0 0 1.25'/></filter><rect width='100%25' height='100%25' filter='url(%23f)' opacity='.26'/></svg>");
  }

  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--fg);font-size:15px;overflow:hidden;transition:background .4s,color .4s}
  body::before{content:"";position:fixed;inset:0;background:var(--lights);pointer-events:none}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .hidden{display:none!important}
  ::-webkit-scrollbar{width:6px} ::-webkit-scrollbar-thumb{background:var(--edge);border-radius:6px}

  /* ---------- Suyuq shisha (liquid glass) ---------- */
  .glass{
    position:relative; isolation:isolate; overflow:hidden;
    background:linear-gradient(145deg,var(--glass-a),var(--glass-b));
    -webkit-backdrop-filter:blur(18px) saturate(190%); backdrop-filter:blur(18px) saturate(190%);
    border:1px solid var(--edge);
    box-shadow:inset 0 1px 0 var(--edge-hi), inset 0 -1px 0 rgba(0,0,0,.14), 0 10px 28px rgba(0,0,0,.22);
    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
  }
  .glass::before{ /* yuqoridagi yorug' chiziq */
    content:""; position:absolute; z-index:-1; inset:0 0 52% 0; border-radius:inherit;
    background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0)); opacity:.55; pointer-events:none;
  }
  button.glass:hover{filter:brightness(1.12); transform:translateY(-1px)}
  button.glass:active{transform:translateY(0) scale(.97)}
  .glass.pri{background:linear-gradient(160deg,var(--pri-a),var(--pri-b)); color:var(--pri-fg); border-color:var(--edge-hi); font-weight:700}
  .glass.pill{border-radius:999px}
  .round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
  .round svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* Til va mavzu tugmalari */
  .tools{display:flex;align-items:center;gap:8px}
  .seg{display:flex;padding:3px;border-radius:999px}
  .seg button{padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);transition:background .2s,color .2s}
  .seg button.on{background:linear-gradient(160deg,var(--gold-a),var(--gold-b));color:var(--gold-fg)}
  [data-theme="dark"] .ic-sun{display:none} [data-theme="light"] .ic-moon{display:none}

  .wall{position:absolute;inset:0;pointer-events:none;
    background-image:var(--veins),linear-gradient(115deg,transparent 36%,var(--sheen) 50%,transparent 64%),var(--wall-glow);
    background-size:900px 900px,100% 100%,100% 100%}

  /* ---------- Kirish ---------- */
  #login{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;background:var(--chat-bg)}
  #login .tools{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;z-index:2}
  #login>*:not(.wall){position:relative;z-index:1}
  #login .tools{position:absolute}
  .brand{font-family:var(--serif);font-weight:500;font-size:clamp(64px,16vw,132px);line-height:1;letter-spacing:.02em;
    background:linear-gradient(110deg,#8a6a1a 0%,#e9c85a 38%,#fff3c4 50%,#d4af37 62%,#8a6a1a 100%);background-size:260% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
  @media (prefers-reduced-motion:no-preference){ .brand{animation:sweep 3.2s cubic-bezier(.4,0,.2,1) 1 both} }
  @keyframes sweep{from{background-position:100% 0}to{background-position:0 0}}
  #login p{font-family:var(--serif);font-size:22px;font-weight:500;color:var(--muted);max-width:24ch;line-height:1.3}
  .btn-google{display:flex;align-items:center;gap:12px;padding:15px 28px;border-radius:999px;font-weight:700;font-size:15px}
  .btn-google svg{background:#fff;border-radius:50%;padding:4px;width:26px;height:26px}
  #loginErr{color:#ff7a7a;font-size:13px;max-width:44ch;min-height:1em}

  /* ---------- Ilova ---------- */
  #app{position:fixed;inset:0;display:grid;grid-template-columns:340px 1fr;gap:14px;padding:14px;height:100dvh}
  .panel{position:relative;border:1px solid var(--edge);border-radius:28px;box-shadow:var(--shadow),inset 0 1px 0 var(--edge-hi);min-height:0;min-width:0;overflow:hidden}
  aside.panel{background:var(--panel);display:flex;flex-direction:column;-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px)}
  .me{display:flex;align-items:center;gap:8px;padding:16px 16px 8px}
  .me-btn{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;padding:6px;border-radius:16px}
  .me-btn:hover{background:var(--theirs)}
  .me .name{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .me .sub{font-size:12px;color:var(--muted)}
  .me .col{min-width:0}
  aside .tools{padding:4px 16px 14px;justify-content:space-between}
  #list{overflow-y:auto;flex:1;padding:4px 10px 12px;border-top:1px solid var(--edge)}
  .item{display:flex;align-items:center;gap:12px;padding:10px 12px;width:100%;text-align:left;border-radius:18px;margin-top:4px;transition:background .15s}
  .item:hover{background:var(--theirs)}
  .item.active{background:var(--theirs);box-shadow:inset 3px 0 var(--gold),inset 0 0 0 1px var(--edge)}
  .item .t{font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.15}
  .item .s{font-size:12px;color:var(--muted)}

  .avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#333;flex:none;box-shadow:0 0 0 1.5px var(--gold)}
  .avatar.sm{width:30px;height:30px}
  .avatar.lg{width:128px;height:128px;box-shadow:0 0 0 2px var(--gold),0 12px 40px rgba(212,175,55,.25)}

  main.panel{display:flex;flex-direction:column;background:var(--chat-bg)}
  .head{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:12px 16px;margin:12px 12px 0;border-radius:22px}
  .head .back{display:none}
  .head .t{font-family:var(--serif);font-weight:600;font-size:24px}
  #msgs{position:relative;z-index:1;flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
  .empty{margin:auto;color:var(--muted);text-align:center;max-width:26ch;font-family:var(--serif);font-size:24px;line-height:1.25}
  .row{display:flex;align-items:flex-end;gap:8px;max-width:76%}
  .row.mine{align-self:flex-end;flex-direction:row-reverse}
  .bubble{padding:10px 14px;border-radius:20px 20px 20px 6px;background:var(--theirs);border:1px solid var(--edge);
    -webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);
    line-height:1.45;word-break:break-word;white-space:pre-wrap;box-shadow:inset 0 1px 0 var(--edge-hi)}
  .mine .bubble{background:linear-gradient(160deg,var(--mine-a),var(--mine-b));color:var(--mine-fg);border-radius:20px 20px 6px 20px;border-color:var(--edge-hi)}
  .bubble .who{display:block;font-family:var(--serif);font-size:15px;font-weight:700;color:var(--muted);margin-bottom:1px}
  .bubble time{display:block;font-size:11px;opacity:.55;margin-top:3px;text-align:right}
  form#send{position:relative;z-index:2;display:flex;gap:10px;padding:8px;margin:0 12px 12px;border-radius:999px;align-items:center}
  #text{flex:1;min-width:0;padding:12px 16px;border:0;background:transparent;color:var(--fg);font:inherit;outline:none}
  #text::placeholder{color:var(--muted)}
  form#send .glass.pri{padding:0 24px;height:44px;border-radius:999px}

  /* Profil oynasi */
  #modal{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px}
  .sheet{background:var(--panel);border:1px solid var(--edge);border-radius:32px;padding:28px;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:var(--shadow)}
  .sheet h2{font-family:var(--serif);font-weight:600;font-size:32px;color:var(--gold)}
  .sheet input[type=text]{width:100%;padding:14px 18px;border-radius:999px;border:1px solid var(--edge);background:var(--theirs);color:var(--fg);font:inherit;text-align:center;outline:none}
  .sheet .actions{display:flex;gap:10px;width:100%}
  .sheet .actions button{flex:1;padding:13px;border-radius:999px}
  .sheet .pick{padding:10px 20px;border-radius:999px}

  .add{padding:0 16px 10px}
  .addrow{display:flex;align-items:center;gap:6px;padding:5px 5px 5px 16px}
  .addrow .at{color:var(--gold);font-weight:700}
  .addrow input{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:inherit;outline:none;padding:8px 0}
  .addrow input::placeholder{color:var(--muted)}
  .addrow button{height:36px;padding:0 16px}
  .addmsg{font-size:13px;min-height:18px;margin:8px 8px 0;color:var(--muted);line-height:1.35}
  .addmsg.err{color:#ff8a8a} .addmsg.ok{color:var(--fg)}
  [data-theme="light"] .addmsg.err{color:#c23b3b}
  .sheet .addmsg{text-align:center;margin:0}
  .note{font-size:12px;color:var(--muted);text-align:center;line-height:1.4}
  .sheet input:disabled{opacity:.6}
  .listempty{padding:22px 14px;text-align:center;color:var(--muted);font-family:var(--serif);font-size:20px;line-height:1.3}

  @media (max-width:700px){
    #app{grid-template-columns:1fr;padding:0;gap:0}
    .panel{border-radius:0;border:0}
    #app.chat-open aside{display:none}
    #app:not(.chat-open) main{display:none}
    .head .back{display:grid}
    .head{margin:calc(8px + env(safe-area-inset-top,0px)) 8px 0}
    form#send{margin:0 8px calc(8px + env(safe-area-inset-bottom,0px))}
    .row{max-width:88%}
    aside .me{padding-top:calc(16px + env(safe-area-inset-top,0px))}
  }
</style>
</head>
<body>

<!-- ============ KIRISH ============ -->
<section id="login">
  <div class="wall"></div>
  <div class="tools">
    <div class="seg glass"><button data-lang="uz">UZ</button><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
    <button class="glass round" data-theme-toggle data-i18n-title="theme">
      <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
  <h1 class="brand">Wmasage</h1>
  <p data-i18n="loginSub"></p>
  <button class="glass pri pill btn-google" id="googleBtn">
    <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
    <span data-i18n="google"></span>
  </button>
  <div id="loginErr"></div>
</section>

<!-- ============ ILOVA ============ -->
<div id="app" class="hidden">
  <aside class="panel">
    <div class="me">
      <button class="me-btn" id="editProfile">
        <img class="avatar" id="meAvatar" alt="">
        <div class="col"><div class="name" id="meName"></div><div class="sub" id="meSub"></div></div>
      </button>
      <button class="glass round" id="logout" data-i18n-title="logout">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
    <div class="tools">
      <div class="seg glass"><button data-lang="uz">UZ</button><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
      <button class="glass round" data-theme-toggle data-i18n-title="theme">
        <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
    <form id="addForm" class="add" autocomplete="off">
      <div class="addrow glass pill">
        <span class="at">@</span>
        <input id="addInput" data-i18n-ph="addPh" maxlength="24" autocapitalize="none" autocorrect="off" spellcheck="false">
        <button class="glass pri pill" type="submit" data-i18n="addBtn"></button>
      </div>
      <div id="addMsg" class="addmsg" role="status"></div>
    </form>
    <div id="list"></div>
  </aside>

  <main class="panel">
    <div class="wall"></div>
    <div class="head glass">
      <button class="glass round back" id="back" data-i18n-title="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <img class="avatar sm" id="peerAvatar" alt="">
      <div class="t" id="peerName"></div>
    </div>
    <div id="msgs"><div class="empty" data-i18n="pickChat"></div></div>
    <form id="send" class="glass hidden" autocomplete="off">
      <input id="text" maxlength="2000" data-i18n-ph="placeholder">
      <button class="glass pri" type="submit" data-i18n="send"></button>
    </form>
  </main>
</div>

<!-- ============ PROFIL ============ -->
<div id="modal" class="hidden">
  <div class="sheet">
    <h2 id="pTitle" data-i18n="profile"></h2>
    <img class="avatar lg" id="pAvatar" alt="">
    <input type="file" id="file" accept="image/*" class="hidden">
    <button class="glass pick" id="pickPhoto" data-i18n="choosePhoto"></button>
    <input type="text" id="pName" maxlength="40" data-i18n-ph="yourName">
    <input type="text" id="pWid" maxlength="20" data-i18n-ph="widPh" autocapitalize="none" autocorrect="off" spellcheck="false">
    <div class="note" id="pNote" data-i18n="widNote"></div>
    <div class="addmsg err" id="pErr"></div>
    <div class="actions">
      <button class="glass" id="pCancel" data-i18n="cancel"></button>
      <button class="glass pri" id="pSave" data-i18n="save"></button>
    </div>
  </div>
</div>

<!-- ============ TIL VA MAVZU ============ -->

      pickChat:"Выберите собеседника, чтобы начать.",noMsgs:"Сообщений пока нет. Напишите первым.",
      placeholder:"Напишите сообщение…",send:"Отправить",profile:"Профиль",choosePhoto:"Выбрать фото",yourName:"Ваше имя",
      cancel:"Отмена",save:"Сохранить",addPh:"Введите Wmasage ID",addBtn:"Добавить",notConnected:"Этот пользователь не подключён к Wmasage.",selfAdd:"Это ваш собственный ID.",already:"Этот человек уже в списке.",added:"Добавлен:",badId:"ID: 3–20 символов, латиница, цифры и _",noContacts:"Пока никого нет. Введите Wmasage ID друга выше.",createId:"Создайте Wmasage ID",widPh:"Wmasage ID",widTaken:"Этот ID занят. Выберите другой.",widNote:"ID выбирается один раз и потом не меняется. Друзья будут добавлять вас по этому ID.",unknown:"Неизвестный",newUser:"Пользователь",
      errPrefix:"Ошибка: ",errLogin:"Не удалось войти: ",
      errFile:"Не открывайте файл напрямую. Откройте через http://localhost:8000 или на Netlify.",
      errConfig:"firebaseConfig не заполнен. Вставьте ключи из Firebase в начало файла.",
      errLoad:"Firebase не загрузился. Проверьте интернет и firebaseConfig, откройте страницу через http://localhost:8000."},
    en:{loginSub:"Chat with your friends. Sign in with your Google account.",google:"Sign in with Google",
      editProfile:"Edit profile",logout:"Sign out",theme:"Day / night",back:"Back",
      general:"General chat",generalSub:"Open to everyone",privateSub:"Private chat",
      pickChat:"Pick someone to start chatting.",noMsgs:"No messages yet. Be the first to write.",
      placeholder:"Type a message…",send:"Send",profile:"Profile",choosePhoto:"Choose photo",yourName:"Your name",
      cancel:"Cancel",save:"Save",addPh:"Enter a Wmasage ID",addBtn:"Add",notConnected:"This user isn't connected to Wmasage.",selfAdd:"That's your own ID.",already:"This person is already in your list.",added:"Added:",badId:"ID: 3–20 characters, letters a–z, digits and _",noContacts:"No one here yet. Enter a friend's Wmasage ID above.",createId:"Create your Wmasage ID",widPh:"Wmasage ID",widTaken:"This ID is taken. Pick another one.",widNote:"You pick your ID once and it can't be changed. Friends add you by this ID.",unknown:"Unknown",newUser:"User",
      errPrefix:"Error: ",errLogin:"Sign-in failed: ",
      errFile:"Don't open the file directly. Use http://localhost:8000 or Netlify.",
      errConfig:"firebaseConfig is not filled in. Paste your Firebase keys at the top of the file.",
      errLoad:"Firebase did not load. Check your internet and firebaseConfig, and open the page via http://localhost:8000."}
  };
  var lang; try{ lang = localStorage.getItem('lang'); }catch(e){}
  if(!lang){ lang = (navigator.language||'uz').slice(0,2); }
  if(!T[lang]) lang = 'uz';

  window.t = function(k){ return (T[lang] && T[lang][k]) || T.uz[k] || k; };
  window.getLang = function(){ return lang; };
  window.showErr = function(k, extra){ var e=document.getElementById('loginErr'); if(e) e.textContent = t(k) + (extra||''); };

  window.applyI18n = function(root){
    root = root || document;
    root.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.dataset.i18n); });
    root.querySelectorAll('[data-i18n-ph]').forEach(function(el){ el.placeholder = t(el.dataset.i18nPh); });
    root.querySelectorAll('[data-i18n-title]').forEach(function(el){ var s=t(el.dataset.i18nTitle); el.title=s; el.setAttribute('aria-label',s); });
  };
  function setLang(l){
    lang = l; try{ localStorage.setItem('lang', l); }catch(e){}
    document.documentElement.lang = l;
    applyI18n();
    document.querySelectorAll('[data-lang]').forEach(function(b){ b.classList.toggle('on', b.dataset.lang === l); });
    window.dispatchEvent(new Event('langchange'));
  }
  function setTheme(th){
    document.documentElement.dataset.theme = th;
    try{ localStorage.setItem('theme', th); }catch(e){}
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-lang]'); if(b) setLang(b.dataset.lang);
    if(e.target.closest('[data-theme-toggle]')) setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  });
  setLang(lang);

  // Diagnostika
  window.addEventListener('error', function(ev){ showErr('errPrefix', ev.message || ''); });
  window.addEventListener('unhandledrejection', function(ev){ var r=ev.reason; showErr('errPrefix', (r && (r.code || r.message)) || r); });
  if (location.protocol === 'file:') showErr('errFile');
  setTimeout(function(){ if(!window.__loaded) showErr('errLoad'); }, 5000);
})();
</script>

<script type="module">
window.__loaded = true;
/* ============ 1. FIREBASE SOZLAMALARI — o'zingiznikini qo'ying ============ */
const firebaseConfig = {
  apiKey: "AIzaSyD7yjZDMbt9hSmEUVtSR69c5tVLmW9iz8A",
  authDomain: "wmasage.firebaseapp.com",
  projectId: "wmasage",
  storageBucket: "wmasage.firebasestorage.app",
  messagingSenderId: "974370325602",
  appId: "1:974370325602:web:5c22a3c936f3b4f5e37d3b"
};
/* ========================================================================= */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, limit,
  onSnapshot, serverTimestamp, runTransaction, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

if (Object.values(firebaseConfig).some(v => String(v).includes("SIZNING_"))) showErr("errConfig");

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

let me = null, users = {}, currentChat = null, unsubMsgs = null, pendingPhoto = null,
    msgCache = [], contactIds = [], unsubs = [], userUnsubs = {}, addState = null;
const locale = () => ({ uz: "uz", ru: "ru", en: "en" })[getLang()] || "uz";
const normWid = s => String(s || "").trim().replace(/^@+/, "").toLowerCase();
const validWid = s => /^[a-z0-9_]{3,20}$/.test(s);

function cleanup() {
  unsubs.forEach(f => f()); unsubs = [];
  Object.values(userUnsubs).forEach(f => f()); userUnsubs = {};
  if (unsubMsgs) unsubMsgs(); unsubMsgs = null;
  users = {}; contactIds = []; currentChat = null; msgCache = []; me = null;
  $("send").classList.add("hidden"); $("app").classList.remove("chat-open");
}

/* ---------- Avatar ---------- */
function placeholder(name) {
  const ch = (name || "?").trim().charAt(0).toUpperCase().replace(/[<>&"']/g, "");
  return "data:image/svg+xml;utf8," + encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#5a5a5a'/><stop offset='1' stop-color='#1c1c1c'/></linearGradient></defs><rect width='96' height='96' fill='url(#g)'/><text x='48' y='64' font-size='44' font-family='Georgia,serif' text-anchor='middle' fill='#fff'>${ch}</text></svg>`);
}
function setAvatar(el, photo, name) { el.src = photo || placeholder(name); }
function avatarEl(photo, name, cls = "avatar") {
  const i = document.createElement("img"); i.className = cls; i.alt = name || ""; setAvatar(i, photo, name); return i;
}

/* ---------- Kirish ---------- */
$("googleBtn").onclick = async () => {
  $("loginErr").textContent = "";
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { showErr("errLogin", e.code || e.message); }
};
$("logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  cleanup();
  if (!user) { $("app").classList.add("hidden"); $("login").classList.remove("hidden"); return; }
  try {
    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      await setDoc(ref, { uid: user.uid, name: user.displayName || t("newUser"), photo: null, createdAt: serverTimestamp() });
    }
    me = (await getDoc(ref)).data(); users[me.uid] = me;
    $("login").classList.add("hidden"); $("app").classList.remove("hidden");
    renderMe(); renderList();

    unsubs.push(onSnapshot(ref, s => { if (s.exists()) { me = s.data(); users[me.uid] = me; renderMe(); } }));
    unsubs.push(onSnapshot(collection(db, "users", me.uid, "contacts"), snap => {
      contactIds = snap.docs.map(d => d.id); syncPeers(); renderList();
    }));
    if (!me.wid) openProfile();       // ID hali yaratilmagan — majburiy
  } catch (e) { showErr("errPrefix", e.code || e.message); }
});

function renderMe() {
  $("meName").textContent = me.name;
  $("meSub").textContent = me.wid ? "@" + me.wid : t("editProfile");
  setAvatar($("meAvatar"), me.photo, me.name);
}

/* ---------- Kontaktlar ---------- */
function syncPeers() {
  contactIds.forEach(id => {
    if (userUnsubs[id]) return;
    userUnsubs[id] = onSnapshot(doc(db, "users", id), s => {
      if (!s.exists()) return;
      users[id] = s.data(); renderList();
      if (currentChat && currentChat.uid === id) { openHeader(currentChat); paintMsgs(); }
    });
  });
  Object.keys(userUnsubs).forEach(id => { if (!contactIds.includes(id)) { userUnsubs[id](); delete userUnsubs[id]; } });
}
function renderList() {
  const list = $("list"); list.innerHTML = "";
  const people = contactIds.map(id => users[id]).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name));
  if (!contactIds.length) {
    const e = document.createElement("div"); e.className = "listempty"; e.dataset.i18n = "noContacts"; list.append(e); applyI18n(list); return;
  }
  people.forEach(u => {
    const b = document.createElement("button"); b.className = "item" + (currentChat?.uid === u.uid ? " active" : "");
    b.append(avatarEl(u.photo, u.name));
    const d = document.createElement("div");
    d.innerHTML = '<div class="t"></div><div class="s"></div>';
    d.firstChild.textContent = u.name; d.lastChild.textContent = u.wid ? "@" + u.wid : "";
    b.append(d); b.onclick = () => openChat(u); list.append(b);
  });
}

function setAdd(kind, key, extra) {
  addState = key ? { kind, key, extra } : null;
  const el = $("addMsg"); el.className = "addmsg " + kind;
  el.textContent = key ? t(key) + (extra || "") : "";
}
$("addForm").onsubmit = async e => {
  e.preventDefault();
  const wid = normWid($("addInput").value);
  if (!wid) return;
  if (!validWid(wid)) return setAdd("err", "badId");
  if (wid === me.wid) return setAdd("err", "selfAdd");
  setAdd("", "");
  try {
    const s = await getDoc(doc(db, "wids", wid));
    if (!s.exists()) return setAdd("err", "notConnected");
    const uid = s.data().uid;
    const us = await getDoc(doc(db, "users", uid));
    if (!us.exists()) return setAdd("err", "notConnected");
    users[uid] = us.data();
    if (contactIds.includes(uid)) { setAdd("ok", "already"); return openChat(users[uid]); }
    const batch = writeBatch(db);                       // ikki tomonlama qo'shiladi
    batch.set(doc(db, "users", me.uid, "contacts", uid), { uid, addedAt: serverTimestamp() });
    batch.set(doc(db, "users", uid, "contacts", me.uid), { uid: me.uid, addedAt: serverTimestamp() });
    await batch.commit();
    $("addInput").value = "";
    setAdd("ok", "added", " @" + wid);
    openChat(users[uid]);
  } catch (err) { setAdd("err", "errPrefix", err.code || err.message); }
};

/* ---------- Suhbat ---------- */
function openHeader(chat) {
  const u = users[chat.uid] || {};
  $("peerName").textContent = u.name || "";
  setAvatar($("peerAvatar"), u.photo, u.name);
}
function openChat(u) {
  currentChat = { id: [me.uid, u.uid].sort().join("_"), uid: u.uid };
  msgCache = []; openHeader(currentChat); renderList(); paintMsgs();
  $("app").classList.add("chat-open"); $("send").classList.remove("hidden");
  if (unsubMsgs) unsubMsgs();
  const q = query(collection(db, "chats", currentChat.id, "messages"), orderBy("createdAt", "asc"), limit(200));
  unsubMsgs = onSnapshot(q, snap => { msgCache = snap.docs.map(d => d.data()); paintMsgs(); },
    err => showErr("errPrefix", err.code || err.message));
  $("text").focus();
}
function paintMsgs() {
  const box = $("msgs"); box.innerHTML = "";
  if (!currentChat || !msgCache.length) {
    const e = document.createElement("div"); e.className = "empty";
    e.dataset.i18n = currentChat ? "noMsgs" : "pickChat"; box.append(e); applyI18n(box); return;
  }
  msgCache.forEach(m => box.append(renderMsg(m)));
  box.scrollTop = box.scrollHeight;
}
function renderMsg(m) {
  const mine = m.uid === me.uid, u = users[m.uid] || {};
  const row = document.createElement("div"); row.className = "row" + (mine ? " mine" : "");
  row.append(avatarEl(u.photo, u.name, "avatar sm"));
  const b = document.createElement("div"); b.className = "bubble";
  const tx = document.createElement("span"); tx.textContent = m.text; b.append(tx);
  const time = document.createElement("time");
  time.textContent = m.createdAt ? m.createdAt.toDate().toLocaleTimeString(locale(), { hour: "2-digit", minute: "2-digit" }) : "…";
  b.append(time); row.append(b); return row;
}
$("send").onsubmit = async e => {
  e.preventDefault();
  const text = $("text").value.trim(); if (!text || !currentChat) return;
  $("text").value = "";
  try { await addDoc(collection(db, "chats", currentChat.id, "messages"), { uid: me.uid, text, createdAt: serverTimestamp() }); }
  catch (err) { showErr("errPrefix", err.code || err.message); }
};
$("back").onclick = () => $("app").classList.remove("chat-open");

window.addEventListener("langchange", () => {
  if (!me) return;
  renderMe(); renderList(); if (currentChat) openHeader(currentChat); paintMsgs();
  if (addState) setAdd(addState.kind, addState.key, addState.extra);
});

/* ---------- Profil va Wmasage ID ---------- */
function pErr(key, extra) { $("pErr").textContent = key ? t(key) + (extra || "") : ""; }
function openProfile() {
  const setup = !me.wid;
  pendingPhoto = me.photo; $("pName").value = me.name; setAvatar($("pAvatar"), me.photo, me.name);
  $("pWid").value = me.wid || ""; $("pWid").disabled = !setup;
  $("pNote").classList.toggle("hidden", !setup);
  $("pCancel").classList.toggle("hidden", setup);      // ID yaratmaguncha yopib bo'lmaydi
  $("pTitle").dataset.i18n = setup ? "createId" : "profile"; applyI18n($("modal"));
  pErr(""); $("modal").classList.remove("hidden");
}
$("editProfile").onclick = openProfile;
$("pCancel").onclick = () => $("modal").classList.add("hidden");
$("pickPhoto").onclick = () => $("file").click();
$("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const S = 200, c = document.createElement("canvas"); c.width = c.height = S;
    const m = Math.min(img.width, img.height), sx = (img.width - m) / 2, sy = (img.height - m) / 2;
    c.getContext("2d").drawImage(img, sx, sy, m, m, 0, 0, S, S);
    pendingPhoto = c.toDataURL("image/jpeg", 0.8);
    setAvatar($("pAvatar"), pendingPhoto, $("pName").value);
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f);
};
$("pSave").onclick = async () => {
  const name = $("pName").value.trim() || me.name;
  pErr("");
  try {
    if (!me.wid) {
      const wid = normWid($("pWid").value);
      if (!validWid(wid)) return pErr("badId");
      await runTransaction(db, async tx => {
        const wref = doc(db, "wids", wid);
        if ((await tx.get(wref)).exists()) throw { code: "wid-taken" };
        tx.set(wref, { uid: me.uid });
        tx.set(doc(db, "users", me.uid), { name, photo: pendingPhoto, wid }, { merge: true });
      });
    } else {
      await setDoc(doc(db, "users", me.uid), { name, photo: pendingPhoto }, { merge: true });
    }
    $("modal").classList.add("hidden");
  } catch (e) {
    if (e.code === "wid-taken") pErr("widTaken"); else pErr("errPrefix", e.code || e.message);
  }
};
</script>
</body>
</html>
